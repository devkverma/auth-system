spring:
  application:
    name: auth
  
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    username: ${DB_USERNAME:auth_user}
    password: ${DB_PASSWORD:1234}

  jpa:
    hibernate:
      ddl-auto: update

    open-in-view: false

server:
  port: 8080

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 900000
  auth:
    max-sessions: 3
    session-ttl: PT168H # PT168H is an ISO-8601 duration representing 168 hours, or seven days.
